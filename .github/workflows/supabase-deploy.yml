name: Deploy Supabase (Migrations & Functions)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/**'
      - 'content/audio/**'
      - 'content/images/**'
      - 'scripts/sync-media.js'
      - 'scripts/lib/media.js'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:
    inputs:
      reset_database:
        description: 'ATENCIÓN: Resetear base de datos remota antes de migrar (supabase db reset --linked)'
        type: boolean
        required: false
        default: false

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Migrations, Seed and Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Link project
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Los clips van antes que el seed: el catálogo nunca apunta a un fichero
      # que Storage aún no tiene. sync-media crea el bucket si falta, sube los
      # hashes pendientes y nunca borra. La clave service_role se pide a la API
      # de gestión con el access token, así que no hace falta otro secreto.
      - name: Sync media to Storage
        run: |
          SUPABASE_SERVICE_ROLE_KEY=$(supabase projects api-keys --project-ref "$SUPABASE_PROJECT_ID" -o json \
            | node -e 'const keys = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(keys.find(k => k.name === "service_role").api_key)')
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          export SUPABASE_SERVICE_ROLE_KEY
          node scripts/sync-media.js

      - name: Reset Remote Database (if requested via workflow_dispatch)
        if: ${{ github.event.inputs.reset_database == 'true' }}
        run: |
          echo "y" | supabase db reset --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Push Database Migrations & Seed
        if: ${{ github.event.inputs.reset_database != 'true' }}
        run: |
          supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Function - generate-exercise
        run: |
          supabase functions deploy generate-exercise --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Edge Function - tokenize-reading
        run: |
          supabase functions deploy tokenize-reading --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify TypeScript Types Generation
        run: |
          supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" > /tmp/database.types.ts
          if [ -s /tmp/database.types.ts ]; then
            echo "TypeScript types generated successfully ($(wc -l < /tmp/database.types.ts) lines)."
          else
            echo "::error::Types generation resulted in empty file."
            exit 1
          fi

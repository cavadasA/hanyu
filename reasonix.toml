s\nall_words = []\nfor level in [1, 2, 3]:\n    with open(f'server/db/seeds/hsk{level}-words.json') as f:\n        words = json.load(f)\n    for w in words:\n        w['_level'] = level\n    all_words.extend(words)\n\n# Print them with their English meanings\nfor w in all_words:\n    print(f\"{w['hanzi']}\\t{w['pinyin']}\\tHSK{w['_level']}\\t{w['meaning_en']}\")\nPYEOF"]
